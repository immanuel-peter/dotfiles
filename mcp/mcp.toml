[mcp_servers.huggingface]
url = "https://huggingface.co/mcp"
bearer_token_env_var = "HF_TOKEN"

[mcp_servers.shadcn]
command = "npx"
args = ["shadcn@latest", "mcp"]

[mcp_servers.chrome-devtools]
command = "npx"
args = ["chrome-devtools-mcp@latest"]

[mcp_servers.gitHub]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_MCP_PAT"

[mcp_servers.perplexity]
command = "npx"
args = ["-y", "@perplexity-ai/mcp-server"]
env_vars = ["PERPLEXITY_API_KEY"]

[mcp_servers.deepwiki]
url = "https://mcp.deepwiki.com/mcp"

[mcp_servers.markitdown]
command = "uvx"
args = ["markitdown-mcp"]

[mcp_servers.openai-docs]
url = "https://developers.openai.com/mcp"

[mcp_servers.claude-code-docs]
url = "https://code.claude.com/docs/mcp"

[mcp_servers.brev-docs]
url = "https://docs.nvidia.com/brev/_mcp/server"

[mcp_servers.xai-docs]
url = "https://docs.x.ai/api/mcp"

[mcp_servers.alphaxiv]
url = "https://api.alphaxiv.org/mcp/v1"
bearer_token_env_var = "ALPHAXIV_API_KEY"

[mcp_servers.remotion]
command = "npx"
args = ["@remotion/mcp@latest"]

[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest"]

[mcp_servers.agent-browser]
command = "agent-browser"
args = ["mcp"]
